# Deploy from the repo root:
#   fly deploy --config apps/clip_annotator/fly.toml --dockerfile apps/clip_annotator/Dockerfile apps/clip_annotator
# (rename `app` if the name is taken)
app = "sensecv-clip-annotator"
primary_region = "gru"
kill_signal = "SIGTERM"   # gunicorn graceful stop (Fly's default SIGINT is an abrupt one)
kill_timeout = 30   # seconds the app gets to flush unsaved annotations on shutdown

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Videos (a `publish --bundle`), index and annotations all live on the volume:
  # no Google token that expires every 7 days. Set "drive" (plus the Drive
  # secrets below and VIDEO_CACHE_DIR / ANNOTATOR_INDEX_DB) to use Drive instead.
  ANNOTATOR_STORAGE = "volume"
  ANNOTATOR_DATA_DIR = "/data"

# Secrets (never in this file): ANNOTATOR_TOKENS_JSON
# Drive mode only: VIDEOS_DRIVE_FOLDER_ID, ANNOTATIONS_DRIVE_FOLDER_ID,
# GOOGLE_AUTHORIZED_USER_JSON (or GOOGLE_SERVICE_ACCOUNT_JSON)

[mounts]
  source = "clip_annotator_data"
  destination = "/data"
  initial_size = "3gb"

[http_service]
  internal_port = 8080
  force_https = true
  # Stop when idle so an unused deployment costs only its volume. Volume mode writes
  # every save straight to disk; Drive mode flushes its write-behind cache at exit.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  memory_mb = 512
  cpu_kind = "shared"
  cpus = 1
