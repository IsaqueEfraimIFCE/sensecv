# Deploy from this folder (flyctl resolves --config relative to the build dir):
#   cd apps/clip_annotator && fly deploy --ha=false
# (rename `app` if the name is taken)
app = "sensecv-clip-annotator"
primary_region = "gru"
kill_signal = "SIGTERM"   # gunicorn graceful stop (Fly's default SIGINT is an abrupt one)
kill_timeout = 30   # seconds the app gets to flush unsaved annotations on shutdown

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Everything lives on Google Drive (videos, index, annotations), like the frame
  # annotator. No volume: the index and a small video cache sit on the machine's
  # temporary disk and are rebuilt from Drive on every start. (ANNOTATOR_STORAGE =
  # "volume" + a [mounts] section keeps everything on a Fly volume instead.)
  ANNOTATOR_STORAGE = "drive"
  ANNOTATOR_INDEX_DB = "/tmp/clip_annotator/index.sqlite"
  VIDEO_CACHE_DIR = "/tmp/clip_annotator/cache"
  VIDEO_CACHE_MAX_MB = "1000"

# Secrets (never in this file): ANNOTATOR_TOKENS_JSON, VIDEOS_DRIVE_FOLDER_ID,
# ANNOTATIONS_DRIVE_FOLDER_ID, GOOGLE_AUTHORIZED_USER_JSON (or GOOGLE_SERVICE_ACCOUNT_JSON)

[http_service]
  internal_port = 8080
  force_https = true
  # Stop when idle so an unused deployment costs nothing. Drive mode flushes its
  # write-behind cache at exit (kill_signal / kill_timeout above).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  memory_mb = 512
  cpu_kind = "shared"
  cpus = 1
